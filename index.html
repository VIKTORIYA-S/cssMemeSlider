<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Meme Slider</title>
</head>
<body>
    <section class="all">
        <div id="slider__wrapper">
            <input class="input" type="radio" name="slider" id="switch-1" checked>
            <input class="input" type="radio" name="slider" id="switch-2">
            <input class="input" type="radio" name="slider" id="switch-3">
            <input class="input" type="radio" name="slider" id="switch-4">
            <input class="input" type="radio" name="slider" id="switch-5">
            <div class="slides__container">
                <div class="ribbon">
                    <div class="image"><img src="./img/1.png" alt="teacher at blackboard"></div>
                    <div class="image"><img src="./img/2.png" alt="boy smiling"></div>
                    <div class="image"><img src="./img/3.png" alt="boy surprised"></div>
                    <div class="image"><img src="./img/4.png" alt="boy upset"></div>
                    <div class="image"><img src="./img/5.png" alt="boy cries"></div>
                </div>
            </div>
            <div class="block">
                <div class="title">
                    <div id="controls" class="controls">
                        <div class="text">Объявляем набор на Summer Bootcamp в RS school</div>
                        <div class="text">О! Это как раз то, что я люблю! Запишусь!</div>
                        <div class="text">Это что? Буквы все знакомые, а ничего не понятно...</div>
                        <div class="text">Да тут еще и дедлайн через два дня..!</div>
                        <div class="text">Не хочу!!! Заберите меня отсюда!!!</div>
                    </div>
                </div>
                <div id="active" class="active">
                    <label for="switch-1" class="circle circle_1"><span class="dot dot_1"></span></label>
                    <label for="switch-2" class="circle circle_2"><span class="dot dot_2"></span></label>
                    <label for="switch-3" class="circle circle_3"><span class="dot dot_3"></span></label>
                    <label for="switch-4" class="circle circle_4"><span class="dot dot_4"></span></label>
                    <label for="switch-5" class="circle circle_5"><span class="dot dot_5"></span></label>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
